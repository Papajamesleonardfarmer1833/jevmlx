name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14  # Apple Silicon runner (MLX requires arm64 macOS)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install (setup-uv already created .venv)
        run: uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Fast tests (no model downloads)
        run: .venv/bin/pytest -m "not slow" -q
