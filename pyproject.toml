[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjev"
version = "0.1.0"
description = "Parallel constrained structured decisions on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ben Shaharizad" }]
dependencies = ["mlx-lm"]

[project.scripts]
openjev = "openjev.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["openjev", "presets"]
